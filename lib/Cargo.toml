[package]
name = "dep-lens-lib"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
name = "dep_lens_lib"

[dependencies]
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uniffi = { version = "0.30.0", optional = true }

[build-dependencies]
uniffi_build = { version = "0.30.0", optional = true }

[features]
default = []
uniffi = ["dep:uniffi", "dep:uniffi_build"]
